    integrations" and never mentions webhooks or events.
- id: graphql
  conforms: false
  evidence: No /graphql surface reachable on any resolvable Vendavo host.
- id: rfc9457
  conforms: unknown
  evidence: No published error reference; error envelope cannot be observed without a tenant.
- id: rfc8594
  conforms: unknown
  evidence: No published deprecation or sunset policy; no changelog and no status page.
- id: mcp
