aid: vendavo
name: Vendavo
description: 'Vendavo is an enterprise B2B commercial-excellence software company whose
  platform helps manufacturers and distributors optimize pricing, automate quoting and
  agreements, and manage rebate and incentive programs using AI-powered pricing intelligence
  and margin analytics. Vendavo has been named a Leader in the Gartner Magic Quadrant
  for B2B Pricing & Rebate Optimization Software and integrates with enterprise ERP,
  CRM, and eCommerce systems. Vendavo markets "real-time APIs for dynamic pricing and
  quoting workflows" alongside batch and file-based integration, but as of this
  enrichment pass it publishes no public developer portal, API reference or
  machine-readable contract: the Vendavo Documentation Portal (one.vendavo.com) redirects
  to an Atlassian ID login and the support portal to a Salesforce Community login, so the
  integration surface is reachable only by contracted customers and partners. Vendavo does
  publish a substantive public security posture — ISO/IEC 27001:2022, annual SOC 1 and
  SOC 2 Type 2 audits, a CSA STAR CAIQ self-assessment and a Trust Center at
  trustvault.vendavo.com. This profile was seeded as a portfolio lead of DCM Ventures and
  Sapphire Ventures.'
