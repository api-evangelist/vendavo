description: >-
  Vendavo publishes no rate limits. The company markets "real-time APIs for dynamic
  pricing and quoting workflows" on its integrations page but there is no public API
  reference to carry limits, no documented throttling policy, no published quota and no
  documented response headers. Vendavo's only product documentation portal
  (one.vendavo.com) redirects to an Atlassian ID login, so any limits that exist are
  visible to contracted customers only. Nothing was observed on a live response because
  no anonymous Vendavo API endpoint is reachable. Recorded zero, not an unchecked field.
